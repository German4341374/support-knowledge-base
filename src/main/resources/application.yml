spring:
  application:
    name: support-knowledge-base
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/support_kb}
    username: ${DATABASE_USER:support_kb}
    password: ${DATABASE_PASSWORD:support_kb_local}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: 1
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  thymeleaf:
    cache: true

server:
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  structured:
    format:
      console: logstash

